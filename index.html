<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Vista</title>
</head>
<body>
    <nav>
        <h2>Scroll Vista</h2>
        <ul>
            <li id="homeBtn">Home</li>
            <li id="servicesBtn">Services</li>
            <li id="contactBtn">Contact</li>
            <li id="modeBtn">🌙</li>
        </ul>
    </nav>
    <!--Hero Section-->
    <section id="home" class="hero">
        <div>
            <h1>Welcome to my wesite "Scroll Vista"</h1>
            <p>Learn Web Development Easily</p>
        </div>
    </section>

    <!--Services Section-->
    <section id="services" class="services">
        <h2>Our Services</h2>

        <div class="cards">
            <div class="card">
                <h3>Web Design</h3>
                <p>Beautiful UI/UX design</p>
            </div>
            <div class="card">
                <h3>Development</h3>
                <p>Modern Web Apps</p>
            </div>
            <div class="card">
                <h3>SEO</h3>
                <p>Boost your ranking</p>
            </div>
        </div>
    </section>

    <!--Contact Section-->
    <section id="contact" class="contact">
        <h2>Contact Us</h2>
        <form action="">
            <label for="name">Name: </label>
            <input type="text" id="name" name="name" placeholder="Your Name">

            <label for="email">E-mail: </label>
            <input type="email" id="email" name="email" placeholder="Enter yor email">

            <label for="discription">Description: </label>
            <textarea name="" id="description" placeholder="Your message"></textarea>

            <button type="submit">Send</button>
        </form>
    </section>
</body>
</html>
